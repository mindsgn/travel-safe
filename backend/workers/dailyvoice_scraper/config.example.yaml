site:
  name: "Daily Voice"
  base_url: "https://dailyvoice.co.za"
  # Public news listing. There is no dedicated /crime section; crime stories
  # appear on this page mixed with other Cape Town news.
  crime_url: "https://dailyvoice.co.za/news/"
  sitemap_url: "https://dailyvoice.co.za/sitemap/daily-voice/news/"

scraper:
  request_delay_seconds: 2
  timeout_seconds: 20
  max_retries: 3
  max_pages: 2
  max_articles: 20
  user_agent: "DailyVoiceCrimeResearchBot/1.0 (+research; respectful crawler)"
  force_rescrape: false

database:
  path: "data/dailyvoice.sqlite3"

cleaning:
  min_confidence: 0.70
  export_dir: "data/export"

deduplication:
  probable_duplicate_threshold: 0.85
  possible_duplicate_threshold: 0.60
  similar_title_threshold: 0.92
  weights:
    same_incident_date: 0.30
    same_suburb: 0.25
    same_crime_type: 0.20
    similar_victim_count: 0.10
    similar_title: 0.10
    similar_text: 0.05

validation:
  allow_future_dates: false
  max_incident_age_days: 3650

logging:
  level: "INFO"
