appId: makers.travel.safe
---
# Live location map smoke test.
# The heatmap is hidden at launch. It only appears after a GPS fix is sent
# to the backend, or after a from/to trip query.

- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "Allow While Using App"
    commands:
      - tapOn: "Allow While Using App"

- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"

- assertVisible:
    id: "safety-map"
- assertVisible:
    id: "map-view"
- assertNotVisible:
    id: "trip-heatmap"
- assertNotVisible:
    id: "trip-pathway"
