appId: makers.travel.safe
---
# Location permission state: denying permission shows the recoverable
# permission card and still renders the map underneath.
#
# Before running, reset the simulator's location permission for this app:
#   xcrun simctl privacy booted reset location makers.travel.safe

- launchApp:
    clearState: true

# Deny the system prompt when it appears.
- runFlow:
    when:
      visible: "Don't Allow"
    commands:
      - tapOn: "Don't Allow"

- runFlow:
    when:
      visible: "Don't allow"
    commands:
      - tapOn: "Don't allow"

- runFlow:
    when:
      visible: "DON'T ALLOW"
    commands:
      - tapOn: "DON'T ALLOW"

# The map stays visible; the permission card explains how to recover.
- assertVisible:
    id: "safety-map"
- assertVisible:
    id: "map-permission-denied"

# The retry affordance is offered.
- assertVisible:
    id: "map-retry"
- tapOn:
    id: "map-retry"

# A still-denied retry keeps the recovery card in place (no crash).
- assertVisible:
    id: "map-permission-denied"
