appId: makers.travel.safe
---
# Trusted contacts: permission explainer + add + persistence + remove.
# Covers every step of the "why does this matter" flow before the system
# permission dialog, then adds a contact through the manual entry path
# (the native contact picker is system UI and cannot be automated).

- launchApp:
    clearState: true

# First launch requests location for the safety map; accept it.
- runFlow:
    when:
      visible: "Allow While Using App"
    commands:
      - tapOn: "Allow While Using App"

# Home screen exposes the trusted contacts entry point.
- assertVisible:
    id: "safety-map"
- assertVisible:
    id: "home-trusted-contacts-entry"
- tapOn:
    id: "home-trusted-contacts-entry"

# First run: the list screen explains why this matters before asking anything.
- assertVisible:
    id: "trusted-contacts-screen"
- assertVisible:
    id: "trusted-contacts-onboarding-card"
- assertVisible:
    id: "trusted-contacts-security-note"
- tapOn:
    id: "trusted-contacts-onboarding-cta"

# The explainer walks through each reason before requesting permission.
- assertVisible:
    id: "trusted-contacts-onboarding"
- assertVisible:
    id: "onboarding-step"
- tapOn:
    id: "onboarding-continue"
- assertVisible:
    id: "onboarding-step"
- tapOn:
    id: "onboarding-continue"
- assertVisible:
    id: "onboarding-step"
- tapOn:
    id: "onboarding-continue"

# Final step explains the exact permission being asked before requesting it.
- assertVisible:
    id: "onboarding-request"
- tapOn:
    id: "onboarding-allow-contacts"

# Accept the system contacts permission dialog (iOS/Android).
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

# Back on the list, empty state, ready to add a contact.
- assertVisible:
    id: "trusted-contacts-screen"
- assertVisible:
    id: "trusted-contacts-add"
- tapOn:
    id: "trusted-contacts-add"

- assertVisible:
    id: "add-contact-screen"
- tapOn:
    id: "add-manually"

- tapOn:
    id: "contact-name-input"
- inputText: "Test Runner"
- tapOn:
    id: "contact-phone-input"
- inputText: "+27821234567"
- tapOn:
    id: "relation-chip-friend"
- tapOn:
    id: "save-contact"

# The saved contact shows on the list with its relationship badge.
- assertVisible:
    id: "trusted-contacts-screen"
- assertVisible:
    text: "Test Runner"
- assertVisible:
    text: "Friend"
- assertVisible:
    text: "+27821234567"

# Contacts persist in SQLite across app restarts.
- stopApp
- launchApp
- tapOn:
    id: "home-trusted-contacts-entry"
- assertVisible:
    id: "trusted-contacts-screen"
- assertVisible:
    text: "Test Runner"

# Removing asks for confirmation and updates the list.
- tapOn: "Remove"
- tapOn: "Remove contact"
- assertNotVisible:
    text: "Test Runner"