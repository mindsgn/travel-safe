appId: makers.travel.safe
---
# Tab navigation: Home, Emergency, Explore and Account are all reachable from
# the bottom tab bar and each shows its dedicated screen. Unique testIDs are
# used because tabs stay mounted and map layers are shared across screens.
# Accepts the location permission prompt when it appears on the map tab.

- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "Allow While Using App"
    commands:
      - tapOn: "Allow While Using App"

- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"

# Home tab is the default.
- assertVisible:
    id: "trip-plan-card"

# Emergency tab.
- tapOn: "Emergency"
- assertVisible:
    id: "emergency-screen"
- assertVisible:
    id: "sos-trigger"

# Explore tab shows the map without a city-wide heatmap.
- tapOn: "Explore"
- assertVisible:
    id: "explore-screen"
- assertNotVisible:
    id: "trip-heatmap"

# Account tab lists settings, the phone code, and safety links.
- tapOn: "Account"
- assertVisible:
    id: "account-screen"
- assertVisible:
    id: "account-title"
- assertVisible:
    id: "account-version"
- assertVisible:
    id: "account-device-code"
- assertVisible:
    id: "account-trusted-contacts"
- assertVisible:
    id: "account-emergency"

# Home tab is reachable again.
- tapOn: "Home"
- assertVisible:
    id: "trip-plan-card"