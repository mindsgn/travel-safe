appId: makers.travel.safe
---
# Emergency SOS: trigger, cancel an accidental activation, complete the
# countdown, confirm live-location sharing, then end the emergency.
# Runs with no trusted contacts (fresh state) so the alert can't hand off
# to the native SMS compose UI and stays within the app.

- launchApp:
    clearState: true

# First launch requests location for the safety map; accept it.
- runFlow:
    when:
      visible: "Allow While Using App"
    commands:
      - tapOn: "Allow While Using App"

# Home screen exposes the SOS entry.
- assertVisible:
    id: "safety-map"
- assertVisible:
    id: "home-sos-entry"
- tapOn:
    id: "home-sos-entry"

# The SOS screen is idle: explainer card + big trigger, location accuracy shown.
- assertVisible:
    id: "emergency-screen"
- assertVisible:
    id: "emergency-idle-card"
- assertVisible:
    id: "sos-trigger"

# Direct lines let the user call the right service without an SOS alert.
- assertVisible:
    id: "emergency-services"
- assertVisible:
    id: "emergency-service-police"
- assertVisible:
    id: "emergency-service-medical"
- assertVisible:
    id: "emergency-service-fire"

# Triggering starts the countdown.
- tapOn:
    id: "sos-trigger"
- assertVisible:
    id: "sos-countdown"
- assertVisible:
    id: "sos-countdown-value"
- assertNotVisible:
    id: "sos-trigger"

# An accidental press can be cancelled before the alert goes out.
- tapOn:
    id: "sos-cancel"
- assertNotVisible:
    id: "sos-countdown"
- assertVisible:
    id: "sos-trigger"

# Trigger again and let the countdown run to zero.
- tapOn:
    id: "sos-trigger"
- assertVisible:
    id: "sos-countdown"

# The countdown completes and the emergency goes active with no recipients,
# so no SMS app is opened and the app stays foregrounded.
- extendedWaitUntil:
    visible:
      id: "sos-status"
    timeout: 12000

# Active state shares the live location, shows accuracy and update count.
- assertVisible:
    id: "sos-alert-status"
- assertVisible:
    id: "emergency-active-accuracy"
- assertVisible:
    id: "emergency-updates-count"

# Ending the emergency stops live sharing.
- tapOn:
    id: "sos-end"
- assertVisible:
    id: "sos-ended"

# Closing returns home.
- tapOn:
    id: "sos-done"
- assertVisible:
    id: "home-sos-entry"